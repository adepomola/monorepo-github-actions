name: Monorepo CI/CD

on:
  push:
    branches:
      - main

jobs:

  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.changes.outputs.services }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Changed Services
        id: changes
        shell: bash
        run: |
          CHANGED_SERVICES=$(git diff --name-only HEAD~1 HEAD | \
            awk -F/ '$1 ~ /^service-[a-z]+$/ {print $1}' | \
            sort -u | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "Changed services: $CHANGED_SERVICES"

          echo "services=$CHANGED_SERVICES" >> "$GITHUB_OUTPUT"

  build-test-deploy:
    name: Build, Test and Deploy
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build ${{ matrix.service }}
        run: |
          echo "Building ${{ matrix.service }}"
          ls -la ${{ matrix.service }}

      - name: Test ${{ matrix.service }}
        run: |
          echo "Testing ${{ matrix.service }}"
          test -f "${{ matrix.service }}/index.html"
          echo "Tests passed for ${{ matrix.service }}"

      - name: Package ${{ matrix.service }}
        run: |
          echo "Packaging ${{ matrix.service }}"
          zip -r "${{ matrix.service }}.zip" "${{ matrix.service }}"

      - name: Deploy ${{ matrix.service }}
        run: |
          echo "Deploying ${{ matrix.service }}"
          echo "Deployment completed successfully!"